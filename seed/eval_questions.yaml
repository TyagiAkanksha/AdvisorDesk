# --- phase-9 wave 1, batch A (task 10): RSU vest · double-trigger IPO · ESPP · firm fees ---

- question: "My first RSU tranche vests next month — what actually happens on the vest date?"
  expected_slugs: ["what-happens-to-your-rsus-at-vest"]
  answerable: true
  class: answerable
  persona: "Sam"
  expected_chunks: ["what-happens-to-your-rsus-at-vest#what-happens-when-my-rsus-vest"]
  reference_answer: >-
    On the vest date the shares are delivered to you and their full market value that day is
    ordinary compensation income reported on your W-2. Your employer withholds tax on that
    amount, most often by holding back some of the vesting shares.

- question: "Why was the tax withheld on my RSU vest less than what I actually owe?"
  expected_slugs: ["what-happens-to-your-rsus-at-vest"]
  answerable: true
  class: answerable
  persona: "Sam"
  expected_chunks: ["what-happens-to-your-rsus-at-vest#why-was-so-little-tax-withheld-on-my-vest"]
  reference_answer: >-
    RSU income is withheld at the flat supplemental-wage rate rather than at your marginal rate,
    so if your marginal rate is higher the withholding covers only part of the bill. The
    difference is due with your return unless you pre-pay it.

- question: "What flat rate does my employer withhold on an RSU vest this year?"
  expected_slugs: ["what-happens-to-your-rsus-at-vest"]
  answerable: true
  class: stale_number
  persona: "Sam"
  expected_chunks: ["what-happens-to-your-rsus-at-vest#key-numbers-2026"]
  reference_answer: >-
    Your employer withholds RSU vest income at a flat 22% federal rate for supplemental wages up
    to $1,000,000 for the year. Once your cumulative supplemental wages cross $1,000,000, the
    excess is withheld at a mandatory flat rate of 37%.

- question: "What does double-trigger vesting actually mean for my RSUs?"
  expected_slugs: ["double-trigger-rsus-and-an-ipo"]
  answerable: true
  class: answerable
  persona: "Priya"
  expected_chunks: ["double-trigger-rsus-and-an-ipo#what-does-double-trigger-vesting-mean"]
  reference_answer: >-
    Double-trigger RSUs need two conditions before you own shares: the time-based vesting
    condition and a liquidity event such as an IPO or acquisition. Until both are met nothing is
    delivered and nothing is taxed.

- question: "My company just filed to go public — when will I owe tax on my RSUs?"
  expected_slugs: ["double-trigger-rsus-and-an-ipo"]
  answerable: true
  class: answerable
  persona: "Priya"
  expected_chunks: ["double-trigger-rsus-and-an-ipo#when-do-i-owe-tax-if-my-company-goes-public"]
  reference_answer: >-
    Tax is due when the shares actually settle, which for double-trigger RSUs is when the
    liquidity condition is met — at or shortly after the IPO, or at lock-up expiry if the plan
    says so. The value at settlement is ordinary wage income.

- question: "My RSUs settle at the IPO and then I am locked up for six months — how should I think about selling?"
  expected_slugs: ["double-trigger-rsus-and-an-ipo", "what-happens-to-your-rsus-at-vest"]
  answerable: true
  class: multi_source
  persona: "Priya"
  expected_chunks:
    - "double-trigger-rsus-and-an-ipo#how-does-the-lock-up-period-change-my-planning"
    - "what-happens-to-your-rsus-at-vest#should-i-sell-my-shares-at-vest-or-hold-them"
  reference_answer: >-
    You already paid ordinary income tax on the settlement value, so selling soon after the
    lock-up lifts usually creates little further gain or loss. Holding instead is a decision to
    keep a concentrated position, which is a risk question rather than a tax question.

- question: "How is my ESPP taxed if I sell the shares right after the purchase date?"
  expected_slugs: ["espp-qualifying-and-disqualifying-dispositions"]
  answerable: true
  class: answerable
  persona: "Sam"
  expected_chunks:
    - "espp-qualifying-and-disqualifying-dispositions#what-makes-a-sale-qualifying-or-disqualifying"
    - "espp-qualifying-and-disqualifying-dispositions#how-much-of-my-espp-gain-is-ordinary-income"
  reference_answer: >-
    Selling that soon is a disqualifying disposition: the discount you received is ordinary income
    on your W-2 and anything above the purchase price is a short-term capital gain. No part of the
    sale gets long-term rates.

- question: "I am on our Berlin payroll — how is my ESPP purchase taxed in Germany?"
  expected_slugs: []
  answerable: false
  class: near_miss
  persona: "Sam"

- question: "I have been buying company shares through payroll deductions. What changes for me once I have held them a while?"
  expected_slugs: ["espp-qualifying-and-disqualifying-dispositions"]
  answerable: true
  class: threshold
  persona: "Sam"
  expected_chunks:
    - "espp-qualifying-and-disqualifying-dispositions#what-makes-a-sale-qualifying-or-disqualifying"
  reference_answer: >-
    An ESPP sale is qualifying only once both statutory holding periods are met, measured from the
    offering date and from the purchase date; before that it is disqualifying. In a qualifying sale
    a smaller part of the gain is ordinary income and the rest is long-term capital gain.

- question: "How does Queen City Wealth Planning charge for its services?"
  expected_slugs: ["how-we-work-and-what-we-charge"]
  answerable: true
  class: answerable
  persona: "Marcus"
  expected_chunks: ["how-we-work-and-what-we-charge#how-does-queen-city-wealth-planning-get-paid"]
  reference_answer: >-
    Queen City Wealth Planning is fee-only: it is paid directly by its clients and takes no
    commissions or referral fees. Its published schedule sets out an ongoing advisory fee and a
    flat-fee planning engagement.

- question: "If I hire you, how do you help me decide whether to sell my RSUs at vest, and how are you paid for that?"
  expected_slugs: ["how-we-work-and-what-we-charge", "what-happens-to-your-rsus-at-vest"]
  answerable: true
  class: multi_source
  persona: "Marcus"
  expected_chunks:
    - "how-we-work-and-what-we-charge#how-does-queen-city-wealth-planning-get-paid"
    - "how-we-work-and-what-we-charge#what-does-your-fee-cover"
    - "what-happens-to-your-rsus-at-vest#should-i-sell-my-shares-at-vest-or-hold-them"
  reference_answer: >-
    The sell-or-hold decision sits inside the ongoing advisory relationship the firm's fee covers,
    alongside the withholding check and the concentration review. Because the firm is fee-only,
    the recommendation does not change based on whether you sell.

# --- phase-9 wave 1, batch B (task 11): ISO/NSO · AMT + credit · 83(b) · onboarding ---

- question: "What is the difference between an ISO and an NSO when I exercise?"
  expected_slugs: ["isos-and-nsos-how-each-one-is-taxed"]
  answerable: true
  class: answerable
  persona: "Priya"
  expected_chunks:
    - "isos-and-nsos-how-each-one-is-taxed#what-is-the-difference-between-an-iso-and-an-nso"
    - "isos-and-nsos-how-each-one-is-taxed#what-do-i-owe-when-i-exercise-an-nso"
  reference_answer: >-
    Exercising an NSO creates ordinary compensation income equal to the spread between your strike
    price and the share value, withheld through payroll. Exercising an ISO creates no regular-tax
    income if you hold the shares, but the same spread is an alternative-minimum-tax item.

- question: "If I exercise my incentive stock options and keep the shares, what do I owe that year?"
  expected_slugs: ["isos-and-nsos-how-each-one-is-taxed"]
  answerable: true
  class: answerable
  persona: "Priya"
  expected_chunks: ["isos-and-nsos-how-each-one-is-taxed#what-do-i-owe-when-i-exercise-an-iso"]
  reference_answer: >-
    For regular tax, nothing is due at exercise when you hold the shares. The spread at exercise is
    an AMT adjustment, so an exercise-and-hold can still produce a bill through the alternative
    minimum tax.

- question: "I have ISOs from my startup and RSUs from my old public employer — how is each one taxed?"
  expected_slugs: ["isos-and-nsos-how-each-one-is-taxed", "what-happens-to-your-rsus-at-vest"]
  answerable: true
  class: multi_source
  persona: "Priya"
  expected_chunks:
    - "isos-and-nsos-how-each-one-is-taxed#what-is-the-difference-between-an-iso-and-an-nso"
    - "what-happens-to-your-rsus-at-vest#what-happens-when-my-rsus-vest"
  reference_answer: >-
    RSUs are taxed as ordinary wage income when they vest and settle, with no timing choice. ISOs
    are not taxed at grant and, for regular tax, not at exercise; the tax depends on when you
    exercise and when you sell, and an exercise can create an AMT item.

- question: "Why would exercising my ISOs create an alternative minimum tax bill?"
  expected_slugs: ["amt-after-an-iso-exercise-and-the-credit-that-follows"]
  answerable: true
  class: answerable
  persona: "Priya"
  expected_chunks:
    - "amt-after-an-iso-exercise-and-the-credit-that-follows#why-does-exercising-an-iso-trigger-amt"
  reference_answer: >-
    The spread between your strike price and the share value at exercise is not regular-tax income,
    but it is added back when you compute the alternative minimum tax. If the AMT result exceeds
    your regular tax, you pay the difference.

- question: "If I pay AMT because of an ISO exercise, do I ever get that money back?"
  expected_slugs: ["amt-after-an-iso-exercise-and-the-credit-that-follows"]
  answerable: true
  class: answerable
  persona: "Priya"
  expected_chunks:
    - "amt-after-an-iso-exercise-and-the-credit-that-follows#what-is-the-amt-credit-and-when-do-i-get-it-back"
  reference_answer: >-
    The AMT you pay on an ISO exercise creates a minimum tax credit that carries forward. You use
    it in later years where your regular tax exceeds your AMT, claimed on Form 8801, usually
    recovering it over several years rather than all at once.

- question: "What is the AMT exemption for a married couple filing jointly this year?"
  expected_slugs: ["amt-after-an-iso-exercise-and-the-credit-that-follows"]
  answerable: true
  class: stale_number
  persona: "Priya"
  expected_chunks: ["amt-after-an-iso-exercise-and-the-credit-that-follows#key-numbers-2026"]
  reference_answer: >-
    For 2026, the AMT exemption for married taxpayers filing jointly is $140,200. That exemption
    begins to phase out once your alternative minimum taxable income reaches $1,000,000.

- question: "What does filing an 83(b) election actually do for me?"
  expected_slugs: ["the-83-b-election-on-restricted-stock"]
  answerable: true
  class: answerable
  persona: "Priya"
  expected_chunks: ["the-83-b-election-on-restricted-stock#what-does-an-83-b-election-actually-do"]
  reference_answer: >-
    An 83(b) election has you taxed on restricted stock at its value when you receive it instead of
    as it vests. You pay ordinary income tax on a small amount up front, and later appreciation is
    capital gain if you hold the shares.

- question: "My divorce is being finalized — how do we split my stock options?"
  expected_slugs: []
  answerable: false
  class: near_miss
  persona: "Priya"

- question: "I bought shares I do not fully own yet and a colleague said I have about a month to tell the IRS something. What is she talking about?"
  expected_slugs: ["the-83-b-election-on-restricted-stock"]
  answerable: true
  class: threshold
  persona: "Priya"
  expected_chunks: ["the-83-b-election-on-restricted-stock#when-does-the-30-day-clock-start-and-end"]
  reference_answer: >-
    She means the 83(b) election, which must be filed within 30 days of the transfer of the
    restricted stock. The deadline runs in calendar days from the transfer date and cannot be
    extended.

- question: "What should I bring to a first meeting with you?"
  expected_slugs: ["onboarding-with-us-and-what-to-bring"]
  answerable: true
  class: answerable
  persona: "Sam"
  expected_chunks:
    - "onboarding-with-us-and-what-to-bring#what-documents-should-i-bring-to-our-first-meeting"
    - "onboarding-with-us-and-what-to-bring#what-do-you-need-from-my-equity-paperwork"
