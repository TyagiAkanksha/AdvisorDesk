[project]
name = "advisordesk-api"
version = "0.1.0"
description = "AdvisorDesk FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2",
    "psycopg[binary]",
    "alembic",
    "pgvector",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "mypy",
    "import-linter",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Body",
]

[tool.mypy]
strict = true
files = ["app"]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "app.models is a pure leaf"
type = "forbidden"
source_modules = ["app.models"]
forbidden_modules = [
    "app.routes",
    "app.services",
    "app.mcp",
    "app.rag",
    "app.agent",
    "app.auth",
    "app.main",
    "app.db",
]

[[tool.importlinter.contracts]]
name = "app.services imports only app.models and app.config"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = [
    "app.routes",
    "app.mcp",
    "app.rag",
    "app.agent",
    "app.auth",
    "app.main",
    "app.db",
]

[[tool.importlinter.contracts]]
name = "app.routes and app.mcp are independent"
type = "independence"
modules = ["app.routes", "app.mcp"]

[[tool.importlinter.contracts]]
name = "nothing imports app.main"
type = "forbidden"
source_modules = [
    "app.routes",
    "app.services",
    "app.mcp",
    "app.rag",
    "app.agent",
    "app.auth",
    "app.models",
]
forbidden_modules = ["app.main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
