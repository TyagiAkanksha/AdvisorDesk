name: advisordesk

# Log rotation (WR-70): the box keeps container logs on the 20 GB root volume with no
# CloudWatch agent, so an unbounded json-file driver would eventually fill the disk.
# Cap each container at 3 x 10 MB.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    image: 181040156847.dkr.ecr.us-east-1.amazonaws.com/advisordesk/api:c3fca19
    env_file:
      - /opt/advisordesk/.env
    environment:
      ENVIRONMENT: production
      CORS_ORIGINS: https://advisordesk.tyagiakanksha.com,https://admin.advisordesk.tyagiakanksha.com
      GOOGLE_REDIRECT_URI: https://api.advisordesk.tyagiakanksha.com/api/v1/auth/callback
      ADMIN_APP_URL: https://admin.advisordesk.tyagiakanksha.com
      MCP_HTTP_ENABLED: "true"
      OAUTH_ISSUER_URL: https://api.advisordesk.tyagiakanksha.com
      # LLM provider — switched to OpenAI 2026-09-06 (NVIDIA NIM embedding + chat
      # models both reached end-of-life Aug 2026). text-embedding-3-small@1024 dims
      # is a drop-in for the existing vector(1024) schema; gpt-4o-mini handles chat
      # + agent tool-calling. Boot guard (app/main.py) validates OPENAI_API_KEY.
      LLM_PROVIDER: openai
      LLM_BASE_URL: https://api.openai.com/v1
      EMBEDDING_MODEL: text-embedding-3-small
      EMBEDDING_DIMENSIONS: "1024"
      CHAT_MODEL: gpt-4o-mini
      SIMILARITY_THRESHOLD: "0.5"
      RATE_LIMIT_PER_MIN: "10"
      RATE_LIMIT_PER_DAY: "50"
      SESSION_CREATE_PER_DAY: "20"
      # api is never published to the host — only Caddy, on the compose bridge
      # network, can reach uvicorn. The bridge subnet is NOT pinned (no `networks:`
      # ipam block; Docker hands out 172.17–172.31.x.0/16 by creation order — it
      # was 172.18.0.0/16 on 2026-09-11), so this trusts the whole RFC 1918 block
      # Docker draws from rather than one /16 that could silently change on a
      # network recreate — a wrong value here fails SILENTLY: uvicorn stops
      # trusting Caddy and every visitor shares one rate-limit bucket (VERIFY.md
      # §2). Caddy already overwrites X-Forwarded-For with the real client IP
      # (see Caddyfile) before proxying, so this is defence in depth — the spoof
      # test (VERIFY.md §2b, recorded 2026-09-11) confirmed Caddy sanitises
      # untrusted XFF even while this was still "*".
      FORWARDED_ALLOW_IPS: "172.16.0.0/12"
    expose:
      - "8000"
    logging: *default-logging
    restart: unless-stopped

  admin:
    image: 181040156847.dkr.ecr.us-east-1.amazonaws.com/advisordesk/admin:c3fca19
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    expose:
      - "3000"
    logging: *default-logging
    restart: unless-stopped

  client:
    image: 181040156847.dkr.ecr.us-east-1.amazonaws.com/advisordesk/client:c3fca19
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      API_URL: https://api.advisordesk.tyagiakanksha.com
    expose:
      - "3000"
    logging: *default-logging
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/advisordesk/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *default-logging
    depends_on:
      - api
      - admin
      - client
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
