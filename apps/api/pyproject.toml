[project]
name = "advisordesk-api"
version = "0.1.0"
description = "AdvisorDesk FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2",
    "psycopg[binary]",
    "alembic",
    "pgvector",
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "itsdangerous>=2.2.0",
    "httpx>=0.28.1",
    "tiktoken>=0.13.0",
    "openai>=2.51.0",
    "pyyaml>=6.0.3",
    "mcp>=2.0.0",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "import-linter",
    "types-pyyaml>=6.0.12.20260724",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Body",
]

[tool.mypy]
strict = true
files = ["app"]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "app.models is a pure leaf"
type = "forbidden"
source_modules = ["app.models"]
forbidden_modules = [
    "app.routes",
    "app.services",
    "app.mcp",
    "app.rag",
    "app.agent",
    "app.auth",
    "app.main",
    "app.db",
    "app.config",
    "app.factory",
]

# Phase-9 task-03 (controller ruling), fix round 1 M11: moved above `name =` — this comment was
# previously placed AFTER `forbidden_modules`'s closing `]`, where it read as documenting the
# NEXT contract block instead of this one. The INDEX already claimed this direction was
# forbidden, but `app.eval` was missing from `forbidden_modules` until now —
# `app.services.eval_runs` accepts `EvalRowLike`/`EvalReportLike` Protocols (structural typing, no
# `app.eval` import) precisely so this newly-enforced entry stays green; the layering is now a
# gate, not just a habit.
[[tool.importlinter.contracts]]
name = "app.services imports only app.models and app.config"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = [
    "app.routes",
    "app.mcp",
    "app.rag",
    "app.agent",
    "app.auth",
    "app.main",
    "app.db",
    "app.factory",
    "app.eval",
]

[[tool.importlinter.contracts]]
name = "app.auth imports only app.services, app.models, and app.config"
type = "forbidden"
source_modules = ["app.auth"]
forbidden_modules = [
    "app.routes",
    "app.mcp",
    "app.rag",
    "app.agent",
    "app.main",
    "app.db",
    "app.factory",
]

[[tool.importlinter.contracts]]
name = "app.rag imports only app.services, app.models, and app.config"
type = "forbidden"
source_modules = ["app.rag"]
forbidden_modules = [
    "app.routes",
    "app.mcp",
    "app.agent",
    "app.auth",
    "app.main",
    "app.db",
    "app.factory",
]

[[tool.importlinter.contracts]]
name = "app.agent imports only app.mcp, app.services, app.models, and app.config"
type = "forbidden"
source_modules = ["app.agent"]
forbidden_modules = [
    "app.routes",
    "app.rag",
    "app.auth",
    "app.main",
    "app.db",
    "app.factory",
]

[[tool.importlinter.contracts]]
name = "app.mcp never imports app.routes, app.agent, or app.db"
type = "forbidden"
source_modules = ["app.mcp"]
forbidden_modules = ["app.routes", "app.agent", "app.db"]
# Phase-5 task-03: was a two-way "independence" contract (task-01) — narrowed to one-directional
# here because `POST /agent/chat` (app.routes.agent_routes) now legitimately reaches
# `app.mcp.runtime.call_tool`/`list_tool_schemas` *through* `app.agent.loop` (the agent tool-loop
# seam, task-03's own Interfaces block: "the only tool interface"). `app.mcp` itself — the
# standalone streamable-HTTP MCP surface — must still never depend on `app.routes` in the other
# direction, so it stays reusable independent of the REST surface; that one-way guarantee is what
# this contract keeps.
#
# Phase-6-remediation task 6R-07 (WR-07): `app.agent` and `app.db` were unguarded gaps — the
# legal direction is `app.agent` -> `app.mcp` (contract above, "app.agent imports only app.mcp,
# ..."), never the reverse, and `app.mcp` gets its `Session`/`sessionmaker` handed in by callers
# (`_AdminGatedMcpApp`/`app.routes.deps`) rather than importing `app.db` to build one itself — so
# both directions are now forbidden here too.

[[tool.importlinter.contracts]]
name = "app.routes never imports app.mcp or app.db directly"
type = "forbidden"
source_modules = ["app.routes"]
forbidden_modules = ["app.mcp", "app.db"]
allow_indirect_imports = true
# Phase-6-remediation task 6R-07 (WR-07): `app.routes` had no contract of its own, so a future
# `routes -> mcp` or `routes -> db` DIRECT import (bypassing `app.agent`) would go uncaught.
# `allow_indirect_imports = true` is load-bearing here, not decorative: import-linter's
# `ForbiddenContract` checks transitive chains by default, and `app.routes.deps -> app.agent.loop
# -> app.mcp.runtime` is exactly such a chain (the owner-ratified path, `POST /agent/chat`,
# phase-5 task-03) — without this flag the contract would be permanently BROKEN by that legal
# indirect import; verified empirically while authoring this contract (ritual below caught it).
# `app.routes -> app.agent` itself is NOT forbidden: routes reaches `app.mcp` only *through*
# `app.agent.loop`'s tool-loop seam, mirroring the one-way guarantee the "app.mcp never imports
# app.routes, ..." contract above already keeps in the other direction. `app.db` has no such
# legitimate indirect path today (a route depends on `app.routes.deps.get_session`, which reads
# `request.app.state.session_factory` rather than importing `app.db`), but the same flag is used
# for both forbidden targets in this one contract so a same-shaped indirect exception, if ever
# legitimately needed for `app.db`, doesn't silently break this contract either.

[[tool.importlinter.contracts]]
name = "nothing imports app.main; only app.main imports app.factory"
type = "forbidden"
source_modules = [
    "app.routes",
    "app.services",
    "app.mcp",
    "app.rag",
    "app.agent",
    "app.auth",
    "app.models",
    "app.config",
    "app.db",
    "app.seed",
    "app.eval",
]
forbidden_modules = ["app.main", "app.factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # starlette 1.x's TestClient nags to install `httpx2` in place of `httpx`
    # on every use. `httpx` is now also a runtime dependency (phase-2
    # task-01: `app.auth.oauth.HttpxGoogleOAuthClient`), not just
    # `TestClient`'s driver; adopting httpx2 is a conventions-level change,
    # deferred (tracked in SUGGESTIONS.md) — silence this one specific
    # warning rather than leaving it as recurring test-output noise.
    'ignore:Using `httpx` with `starlette\.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning',
]
