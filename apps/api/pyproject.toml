[project]
name = "advisordesk-api"
version = "0.1.0"
description = "AdvisorDesk FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2",
    "psycopg[binary]",
    "alembic",
    "pgvector",
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "itsdangerous>=2.2.0",
    "httpx>=0.28.1",
    "tiktoken>=0.13.0",
    "openai>=2.51.0",
    "pyyaml>=6.0.3",
    "mcp>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "import-linter",
    "types-pyyaml>=6.0.12.20260724",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Body",
]

[tool.mypy]
strict = true
files = ["app"]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "app.models is a pure leaf"
type = "forbidden"
source_modules = ["app.models"]
forbidden_modules = [
    "app.routes",
    "app.services",
    "app.mcp",
    "app.rag",
    "app.agent",
    "app.auth",
    "app.main",
    "app.db",
    "app.config",
    "app.factory",
]

[[tool.importlinter.contracts]]
name = "app.services imports only app.models and app.config"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = [
    "app.routes",
    "app.mcp",
    "app.rag",
    "app.agent",
    "app.auth",
    "app.main",
    "app.db",
    "app.factory",
]

[[tool.importlinter.contracts]]
name = "app.auth imports only app.services, app.models, and app.config"
type = "forbidden"
source_modules = ["app.auth"]
forbidden_modules = [
    "app.routes",
    "app.mcp",
    "app.rag",
    "app.agent",
    "app.main",
    "app.db",
    "app.factory",
]

[[tool.importlinter.contracts]]
name = "app.rag imports only app.services, app.models, and app.config"
type = "forbidden"
source_modules = ["app.rag"]
forbidden_modules = [
    "app.routes",
    "app.mcp",
    "app.agent",
    "app.auth",
    "app.main",
    "app.db",
    "app.factory",
]

[[tool.importlinter.contracts]]
name = "app.agent imports only app.mcp, app.services, app.models, and app.config"
type = "forbidden"
source_modules = ["app.agent"]
forbidden_modules = [
    "app.routes",
    "app.rag",
    "app.auth",
    "app.main",
    "app.db",
    "app.factory",
]

[[tool.importlinter.contracts]]
name = "app.mcp never imports app.routes"
type = "forbidden"
source_modules = ["app.mcp"]
forbidden_modules = ["app.routes"]
# Phase-5 task-03: was a two-way "independence" contract (task-01) — narrowed to one-directional
# here because `POST /agent/chat` (app.routes.agent_routes) now legitimately reaches
# `app.mcp.runtime.call_tool`/`list_tool_schemas` *through* `app.agent.loop` (the agent tool-loop
# seam, task-03's own Interfaces block: "the only tool interface"). `app.mcp` itself — the
# standalone streamable-HTTP MCP surface — must still never depend on `app.routes` in the other
# direction, so it stays reusable independent of the REST surface; that one-way guarantee is what
# this contract keeps.

[[tool.importlinter.contracts]]
name = "nothing imports app.main; only app.main imports app.factory"
type = "forbidden"
source_modules = [
    "app.routes",
    "app.services",
    "app.mcp",
    "app.rag",
    "app.agent",
    "app.auth",
    "app.models",
    "app.config",
    "app.db",
    "app.seed",
]
forbidden_modules = ["app.main", "app.factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # starlette 1.x's TestClient nags to install `httpx2` in place of `httpx`
    # on every use. `httpx` is now also a runtime dependency (phase-2
    # task-01: `app.auth.oauth.HttpxGoogleOAuthClient`), not just
    # `TestClient`'s driver; adopting httpx2 is a conventions-level change,
    # deferred (tracked in SUGGESTIONS.md) — silence this one specific
    # warning rather than leaving it as recurring test-output noise.
    'ignore:Using `httpx` with `starlette\.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning',
]
