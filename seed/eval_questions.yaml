# Evaluation question set for the phase-7 groundedness harness (PRD §8.1).
#
# Authored together with seed/sample_content/ (phase-4 task-04). Each item is one of:
#   - question: str
#     expected_slugs: [<published seed slug>, ...]
#     answerable: true
#   - question: str
#     expected_slugs: []
#     answerable: false
#
# Answerable questions are phrased as real client questions the named article(s) genuinely answer;
# every expected_slugs entry is the slug of a `status: published` file under seed/sample_content/
# (apps/api/tests/test_seed.py cross-checks this). Unanswerable questions ask about topics
# deliberately absent from the corpus, to verify the refusal path (PRD §7.5/§8.1: expected outcome
# is retrieval_found = false, a refusal response, no citations).

