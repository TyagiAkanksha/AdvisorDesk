# infra/docker-compose.yml — AdvisorDesk local orchestration (PRD §3.1, §9).
#
# DATABASE_URL points at EITHER Supabase (default, deployed target — PRD §9)
# or the local-db profile's `db` service:
#
#   Supabase (default):  set DATABASE_URL in .env to the Supabase connection
#                         string, then:
#                           docker compose -f infra/docker-compose.yml up -d
#
#   Local Postgres:       docker compose -f infra/docker-compose.yml --profile local-db up -d
#                         with DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres
#                         (service name `db`, not localhost — containers
#                         reach each other over the compose network). Set it
#                         in .env, or export it in the shell — an exported
#                         shell value wins over env_file. See the `api`
#                         service's `environment:` comment below for exactly
#                         how that's wired (neither the naive
#                         `DATABASE_URL: ${DATABASE_URL:-}` form nor the
#                         bare `- DATABASE_URL` pass-through form actually
#                         achieves this on this Compose version — both
#                         silently blank/drop the root .env's value instead
#                         of falling through to it).
#
# Migrations are never run at container startup (CONVENTIONS.md §6) — run
# them explicitly, against whichever DATABASE_URL is active:
#   docker compose -f infra/docker-compose.yml run --rm api uv run alembic upgrade head
#
# See README.md "Dev quickstart" for both paths end to end, including the
# observed depends_on-under-an-inactive-profile behavior noted below.

services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    image: advisordesk-api
    env_file: ../.env
    environment:
      # DATABASE_URL is deliberately NOT a key in this block. Verified
      # three independent ways (`docker compose config`, `docker compose
      # run ... env`, `docker inspect .Config.Env`) that on this Compose
      # version (v5.1.0), ANY entry under `environment:` for a key also
      # present in `env_file:` overrides/removes it — including the bare
      # pass-through form `- DATABASE_URL` (no value): when the shell
      # doesn't have DATABASE_URL set, that form resolves to a real
      # `DATABASE_URL: null` container-env entry, which Docker treats as
      # "unset this," not "defer to env_file." So the originally proposed
      # `- DATABASE_URL` fix has the exact same masking bug as the mapping
      # form it replaced — just "absent" instead of "empty" (found in
      # review; re-confirmed empirically, see README's Implementation
      # notes / the task-05 report's "Fix round 1"). A bare `env_file:
      # ../.env` with NO colliding `environment:` key passes the root
      # .env's DATABASE_URL through untouched (verified in isolation) —
      # that alone is correct for the documented Supabase-default path. A
      # shell-exported override must reach the container under a
      # DIFFERENT key (reusing DATABASE_URL re-triggers the masking above);
      # infra/Dockerfile.api's CMD promotes it to DATABASE_URL at container
      # start only when actually non-empty (see that file's comment).
      DATABASE_URL_SHELL_OVERRIDE: ${DATABASE_URL:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
        # Without this, `depends_on: db` is a HARD compose-level error
        # whenever `db` isn't part of the run (default `up`, no
        # --profile local-db) — verified: plain `docker compose config`
        # (no profile) fails with `service "api" depends on undefined
        # service "db": invalid compose project` before anything starts.
        # `required: false` makes the dependency optional: absent -> skipped,
        # present (local-db profile active) -> still gates on service_healthy.
        required: false

  admin:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        APP: admin
        # BUILD-time arg — Next.js inlines NEXT_PUBLIC_* into the JS bundle
        # at `next build`. Changing this means a rebuild, not a restart.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: advisordesk-admin
    ports:
      - "127.0.0.1:3001:3000"

  client:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        APP: client
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        # Final review, F1: apps/client's server-only src/lib/publicApi.ts reads `API_URL`
        # directly (not NEXT_PUBLIC_-prefixed — see that file's own comment) and `next build`
        # runs page code that calls it during its "Generating static pages" step, so this
        # container-network origin (service name `api`, not localhost — containers reach each
        # other over the compose network, same reasoning as the `db` service note above) is
        # needed as a build arg here...
        API_URL: http://api:8000
    image: advisordesk-client
    # ...AND again here, at container runtime: publicApi.ts's fetches run per-request (SSR),
    # not just once at build time, so the same value has to be present in the running
    # container's environment too — a build arg alone only covers the build-time prerender path.
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"

  # ---------- local-db profile: offline dev Postgres/pgvector (PRD §9) ----------
  db:
    profiles: [local-db]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres # dev-only default password, local-db profile only — never used against Supabase/prod
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - advisordesk_local_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  advisordesk_local_db:
